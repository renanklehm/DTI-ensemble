[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemble"
version = "0.1.0"
description = "ChemBERTa and ESM-2 multimodal ensemble for DTI predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.0",
    "tabulate>=0.10.0",
    "torch>=2.12.1",
    "tqdm>=4.67.1",
    "transformers>=5.12.1",
]

[project.scripts]
ensemble = "ensemble.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
